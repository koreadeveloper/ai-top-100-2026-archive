<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="인터뷰부터 카카오톡 상담까지의 시스템 흐름"><rect width="1200" height="420" rx="20" fill="#f1f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="34" y="52" fill="#182637" font-size="27" font-weight="700">Evidence → Decision → Action</text><rect x="34" y="100" width="244" height="130" rx="14" fill="#ddf4ed" stroke="#c9d5e1"/><text x="54" y="150" fill="#182637" font-size="24" font-weight="650">인터뷰 · 원문</text><text x="54" y="187" fill="#4a5b70" font-size="16">범위 / 판본 / 권한</text><path d="M284 165h31m-9-8 9 8-9 8" fill="none" stroke="#586d83" stroke-width="2"/><rect x="330" y="100" width="244" height="130" rx="14" fill="#fff4d7" stroke="#c9d5e1"/><text x="350" y="150" fill="#182637" font-size="24" font-weight="650">지식 · 정책</text><text x="350" y="187" fill="#4a5b70" font-size="16">출처 대조 / 예외 판단</text><path d="M580 165h31m-9-8 9 8-9 8" fill="none" stroke="#586d83" stroke-width="2"/><rect x="626" y="100" width="244" height="130" rx="14" fill="#f9e4ef" stroke="#c9d5e1"/><text x="646" y="150" fill="#182637" font-size="24" font-weight="650">모델 · 업무 API</text><text x="646" y="187" fill="#4a5b70" font-size="16">조회 / 귀속 / 처리</text><path d="M876 165h31m-9-8 9 8-9 8" fill="none" stroke="#586d83" stroke-width="2"/><rect x="922" y="100" width="244" height="130" rx="14" fill="#e3eafa" stroke="#c9d5e1"/><text x="942" y="150" fill="#182637" font-size="24" font-weight="650">카카오톡 답장</text><text x="942" y="187" fill="#4a5b70" font-size="16">콜백 / 결과 안내</text><rect x="34" y="270" width="1132" height="98" rx="14" fill="white" stroke="#c9d5e1"/><text x="58" y="308" fill="#263c54" font-size="19" font-weight="650">검증 루프</text><text x="58" y="340" fill="#4a5b70" font-size="18">공개 예시 → 실제 호출 확인 → 실패 원인 분류 → 코드·지식 보완 → 실제 채널 재확인</text></g></svg>
